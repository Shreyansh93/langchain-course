[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shreypatni93", email = "109590274+Shreypatni93@users.noreply.github.com" }
]
requires-python = ">=3.15"
dependencies = [
    "langchain>=1.5.2",
    "langchain-ollama>=1.1.0",
    "langchain-xai>=1.4.1",
    "langsmith>=0.15.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-course = "langchain_course.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "langchain_course"
module-root = "src"
